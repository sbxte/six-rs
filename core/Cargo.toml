[package]
name = "six_rs"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"
name = "sixrs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = [
	"blocking",
	"cookies",
	"query",
	"form",
] }
scraper = "0.27.0"
url = "2.5.8"
